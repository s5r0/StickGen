<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quran Player - Listen to the Holy Quran</title>
  <meta name="description" content="Listen to the Holy Quran with multiple reciters. Free Quran audio player with all 114 surahs and many renowned reciters.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-content">
        <div class="logo">
          <div class="logo-icon">&#xFDFD;</div>
          <div class="logo-text">
            <h1>Quran Player</h1>
            <p>Listen to the Holy Quran</p>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main">
      <!-- Controls Section -->
      <section class="controls-section">
        <div class="control-group">
          <label for="reciter-select">Reciter</label>
          <select id="reciter-select" disabled>
            <option value="">Loading reciters...</option>
          </select>
        </div>
        <div class="control-group">
          <label for="surah-select">Surah</label>
          <select id="surah-select" disabled>
            <option value="">Loading surahs...</option>
          </select>
        </div>
      </section>

      <!-- Surah Info -->
      <section class="surah-info" id="surah-info" hidden>
        <h2 id="surah-arabic-name" class="arabic-name"></h2>
        <h3 id="surah-english-name" class="english-name"></h3>
        <p id="surah-translation" class="translation-name"></p>
        <div class="surah-meta">
          <span id="surah-ayah-count"></span>
          <span id="surah-revelation-type"></span>
        </div>
      </section>

      <!-- Player Section -->
      <section class="player-section" id="player-section">
        <div class="now-playing" id="now-playing" hidden>
          <p class="now-playing-label">Now Playing</p>
          <p class="now-playing-ayah" id="current-ayah-display">Ayah <span id="current-ayah-num">1</span> of <span id="total-ayahs">7</span></p>
        </div>

        <div class="progress-container" id="progress-container" hidden>
          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <div class="progress-time">
            <span id="current-time">0:00</span>
            <span id="duration-time">0:00</span>
          </div>
        </div>

        <div class="player-controls">
          <button class="btn btn-icon" id="btn-prev" title="Previous Ayah" disabled>
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button class="btn btn-play" id="btn-play" title="Play" disabled>
            <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor" id="play-icon"><path d="M8 5v14l11-7z"/></svg>
            <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor" id="pause-icon" hidden><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <button class="btn btn-icon" id="btn-next" title="Next Ayah" disabled>
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>
        </div>

        <div class="player-extras">
          <div class="volume-control">
            <button class="btn btn-icon btn-sm" id="btn-mute" title="Mute">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" id="volume-icon"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" id="mute-icon" hidden><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
            </button>
            <input type="range" id="volume-slider" min="0" max="100" value="80" class="slider">
          </div>
          <div class="repeat-control">
            <button class="btn btn-icon btn-sm" id="btn-repeat-surah" title="Repeat Surah">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
            </button>
            <button class="btn btn-icon btn-sm" id="btn-continuous" title="Continuous Play (next surah)">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
            </button>
          </div>
        </div>
      </section>

      <!-- Surah List Grid -->
      <section class="surah-grid-section">
        <h2 class="section-title">All Surahs</h2>
        <div class="search-box">
          <input type="text" id="surah-search" placeholder="Search surahs..." autocomplete="off">
        </div>
        <div class="surah-grid" id="surah-grid">
          <div class="loading-spinner">Loading surahs...</div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p>Audio provided by <a href="https://alquran.cloud" target="_blank" rel="noopener">Al Quran Cloud API</a></p>
      <p>Free for everyone. No registration required.</p>
    </footer>
  </div>

  <!-- Hidden audio element -->
  <audio id="audio-player" preload="auto"></audio>

  <script src="/js/app.js"></script>
</body>
</html>
